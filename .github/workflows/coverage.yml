name: Test coverage

on:
  pull_request:
    paths:
      - "src/**"
      - "api/**"
      - "lib/**"
      - "middleware/**"
      - "evals/**"
      - "scripts/update-coverage-badge.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/coverage.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "api/**"
      - "lib/**"
      - "middleware/**"
      - "evals/**"
      - "scripts/update-coverage-badge.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Gerar cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes com cobertura
        run: npm run test:coverage

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  publish-badge:
    name: Publicar badge de cobertura
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Obter resumo de cobertura
        uses: actions/download-artifact@v5
        with:
          name: coverage-report
          path: coverage

      - name: Atualizar badge
        run: npm run coverage:badge

      - name: Publicar alteração do badge
        run: |
          if git diff --quiet -- badges/coverage.json; then
            echo "O badge já está atualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          git commit -m "ci: update coverage badge"
          git push
