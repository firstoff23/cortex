name: Dependency security

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-security.yml"
  schedule:
    - cron: "17 9 * * 1"
      timezone: "Europe/Lisbon"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Rever dependências da pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Rever novas dependências vulneráveis
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  audit:
    name: Auditar vulnerabilidades conhecidas
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter o repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de severidade alta ou crítica
        run: npm audit --audit-level=high
